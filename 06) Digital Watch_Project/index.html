<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Watch App</title>
    <link rel="stylesheet" href="style.css" />
    <head> </head>
  </head>
  <body>
    <div class="container">
      <div class="clockHolder">
        <div class="timeHolder">
          <div class="timeOptions">
            <svg class="clock-icon active" viewBox="0 0 24 24">
              <path
                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"
              />
            </svg>

            <!-- Icon 2: Stopwatch / Sliders -->
            <svg class="clock-icon" viewBox="0 0 24 24">
              <path
                d="M3 17v2h6v-2H3zM3 5v2h10v-2H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"
              />
            </svg>

            <!-- Icon 3: Hourglass / CountDown -->
            <svg class="clock-icon" viewBox="0 0 24 24">
              <path
                d="M6 2v6c0 2.2 1.8 4 4 4v0c-2.2 0-4 1.8-4 4v6h12v-6c0-2.2-1.8-4-4-4v0c2.2 0 4-1.8 4-4V2H6zm10 14.5V20H8v-3.5c0-1.4 1.1-2.5 2.5-2.5h3c1.4 0 2.5 1.1 2.5 2.5zM13.5 10h-3C9.1 10 8 8.9 8 7.5V4h8v3.5c0 1.4-1.1 2.5-2.5 2.5z"
              />
            </svg>
          </div>
          <div class="mainDiv">
            <p id="clock"></p>
          </div>
        </div>
      </div>
    </div>
    <script>
      const currentTime = () => {
        let curTime = new Date().toLocaleTimeString();
        document.getElementById("clock").innerText = curTime;
      };
      currentTime();
      setInterval(() => {
        currentTime();
      }, 1000);
    </script>
  </body>
</html>
