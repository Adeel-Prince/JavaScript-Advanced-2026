<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dad Jokes App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Dad Jokes!</h1>
      <section class="api_body"></section>
      <button id="fetchJoke">Get Another Joke</button>
    </div>

    <script>
      const apiBody = document.querySelector(".api_body");

      const apiUrl = "https://icanhazdadjoke.com/";

      const fecthData = () => {
        fetch(apiUrl, {
          headers: {
            Accept: "application/json",
          },
        })
          .then((res) => {
            console.log(res);
            return res.json();
          })
          .then((data) => {
            console.log(data.joke);
            apiBody.innerHTML = data.joke;
          })
          .catch((error) => {
            console.log(error);
          });
      };
      fecthData();
      // Add event listener to fetch new jokes!
      document.getElementById("fetchJoke").addEventListener("click", fecthData);
    </script>
  </body>
</html>
